services:
  - type: web
    name: spendwise-app
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/spendwise.db
    disk:
      name: spendwise-data
      mountPath: /app/data
      sizeGB: 1
